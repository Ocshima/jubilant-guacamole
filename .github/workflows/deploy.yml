name: Deploy Trade ETL Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-trade-etl-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION:  us-east-1
  STACK_NAME:  trade-etl-pipeline
  PYTHON_VER:  '3.12'

jobs:

  # ── JOB 1: Test + Lint ───────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov boto3 aws-xray-sdk cfn-lint

      - name: Run unit tests
        run: |
          pytest tests/ -v \
            --cov=src/processor \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Lint CloudFormation template
        run: cfn-lint infrastructure/template.yaml --include-checks W

  # ── JOB 2: Deploy ────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}
          cache: pip

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TradeETL-${{ github.run_id }}

      - name: SAM build
        run: |
          sam build \
            --template infrastructure/template.yaml \
            --use-container

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --parameter-overrides \
                Environment=prod \
                AlertEmail=${{ secrets.ALERT_EMAIL }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset \
            --tags \
                Project=trade-etl-pipeline \
                ManagedBy=GitHubActions \
                CommitSha=${{ github.sha }}

      - name: Upload mock data to trigger pipeline
        if: github.event.inputs.upload_mock_data == 'true'
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='RawUploadsBucketName'].OutputValue" \
            --output text)
          echo "Uploading valid mock data to: $BUCKET"
          aws s3 cp mock-data/valid/trades_valid.csv \
            s3://$BUCKET/mock-data/valid/trades_valid.csv
          echo "✅ Upload complete — Lambda should trigger within seconds"

  # ── JOB 3: Integration smoke test ────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-SmokeTest-${{ github.run_id }}

      - name: Verify stack outputs exist
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='RawUploadsBucketName'].OutputValue" \
            --output text)
          TABLE=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='TradesTableName'].OutputValue" \
            --output text)
          [ -n "$BUCKET" ] && echo "✅ Uploads bucket: $BUCKET" || exit 1
          [ -n "$TABLE"  ] && echo "✅ Trades table:   $TABLE"  || exit 1

      - name: Verify Lambda is active
        run: |
          FUNC=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text)
          STATE=$(aws lambda get-function \
            --function-name $FUNC \
            --query 'Configuration.State' \
            --output text)
          [ "$STATE" = "Active" ] && echo "✅ Lambda state: Active" || exit 1

      - name: Verify DLQ is empty (no baseline failures)
        run: |
          DLQ_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='DLQUrl'].OutputValue" \
            --output text)
          DEPTH=$(aws sqs get-queue-attributes \
            --queue-url "$DLQ_URL" \
            --attribute-names ApproximateNumberOfMessages \
            --query 'Attributes.ApproximateNumberOfMessages' \
            --output text)
          echo "DLQ depth: $DEPTH"
          [ "$DEPTH" = "0" ] \
            && echo "✅ DLQ is empty" \
            || echo "⚠️  DLQ has $DEPTH messages — investigate before proceeding"
